[package]
name = "sense_bridge_esp32_baseline"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "sense_bridge_esp32_baseline"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
dht11-trace = "0.1"
embedded-hal = "1.0"
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = "0.33"
toml = "1"
