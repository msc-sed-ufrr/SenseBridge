[package]
name = "sense_bridge_esp32"
version = "0.1.0"
edition = "2024"
# Caso de uso da biblioteca no ESP32: não é publicado no crates.io.
publish = false

[[bin]]
name = "sense_bridge_esp32"
# O alvo não tem o test harness da biblioteca padrão.
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
# Símbolos não ocupam Flash; otimizar por tamanho mantém o firmware de depuração pequeno.
debug = true
opt-level = "z"

[dependencies]
sense_bridge = { path = "../../sense-bridge" }
# Driver do DHT11. Até a publicação no crates.io, vem do repositório.
dht11-trace = { git = "https://github.com/marcelobns/dht11-trace", branch = "develop" }
# Traits de pino que o driver usa, para o GPIO opcional de alimentação.
embedded-hal = "1.0"
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = "0.33"
toml = "1"
